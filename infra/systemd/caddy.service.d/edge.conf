# caddy.service drop-in — supply edge config to the packaged Caddy service
#
# /etc/caddy/Caddyfile references {env.EDGE_DOMAIN} and {env.CONTROL_PLANE_BASE}.
# The packaged Debian/Ubuntu caddy.service already passes --environ, so these
# substitutions are resolved from the process environment. This drop-in loads
# those variables from /etc/caddy/edge.env (written by bootstrap.sh with the
# ori.local default). The `-` keeps the unit valid even if the file is absent.
# Install to: /etc/systemd/system/caddy.service.d/edge.conf

[Service]
EnvironmentFile=-/etc/caddy/edge.env