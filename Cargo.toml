[workspace]
resolver = "2"
members = [
    "crates/ori-proto",
    "crates/ori-providers",
    "crates/ori-server",
    "crates/ori-agent",
    "crates/ori-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
