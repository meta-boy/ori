      responses:
        '200':
          description: Prompt run status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptRunResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
