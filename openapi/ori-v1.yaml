        '409': { $ref: '#/components/responses/Conflict' }
  /oris/{oriId}/desktop:
    post:
      tags: [Ori]
      summary: Get desktop streaming URL
      description: "Create or fetch a secret-bearing desktop/noVNC URL for live computer-use visibility. Use `?vnc=1` for noVNC; a `provisioning: true` response means poll again."
      operationId: desktop
      parameters:
        - $ref: '#/components/parameters/OriId'
        - name: vnc
          in: query
          schema:
            type: integer
            enum: [1]
          description: Use VNC/noVNC streaming mode.
        - name: theme
          in: query
          schema:
            type: string
            enum: [light, dark]
