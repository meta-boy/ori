              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
              examples:
                snapshots:
                  value:
                    ok: true
                    type: snapshot.list
                    snapshots:
                      - id: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                        oriId: or_23456789
                        status: completed
                        kind: incremental
                        generation: 3
                        chainId: 4ced5b04-d2cb-4ec3-b127-3b3ed836cab5
                        createdAt: '2026-06-24T06:24:00Z'
                        completedAt: '2026-06-24T06:24:50Z'
                        sizeBytes: 18874368
                        fileCount: 6781
                    pageInfo:
                      nextCursor: null
                      hasMore: false
                      limit: 50
        '401': { $ref: '#/components/responses/Unauthorized' }
  /oris/{oriId}/snapshots:
    get:
      tags: [Ori]
