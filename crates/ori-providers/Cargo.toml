[package]
name = "ori-providers"
version.workspace = true
edition.workspace = true
description = "Sandbox backends behind cargo features: proxmox (default), docker, firecracker, apple-container. One trait impl per module."

[features]
default = ["proxmox"]
# Proxmox LXC backend over the PVE REST API (C4).
proxmox = ["dep:reqwest"]
# Docker Engine backend over the docker API (C7). Container names are the
# opaque instance ids; snapshots are committed images.
docker = ["dep:bollard"]
# Firecracker microVM backend (C17): snapshot-create/snapshot-load suspend and
# resume over the per-VM control API, spawned under the jailer. `libc` is used
# for signalling the daemonized Firecracker process (pidfile → kill); `base64`
# is the vsock exec frame codec.
firecracker = ["dep:libc", "dep:base64"]
# Apple container backend (C17): shells out to the `container` CLI (macOS 26,
# Apple silicon). Declares honestly: no snapshot primitive is documented, so
# fs_snapshot and live_suspend stay false.
apple-container = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"], optional = true }
bollard = { version = "0.21", optional = true }
libc = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }