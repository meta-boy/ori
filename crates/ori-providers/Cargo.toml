[package]
name = "ori-providers"
version.workspace = true
edition.workspace = true
description = "Sandbox backends behind cargo features: proxmox (default), docker, firecracker, apple-container. One trait impl per module."

[features]
default = ["proxmox"]
# Proxmox LXC backend over the PVE REST API (C4).
proxmox = ["dep:reqwest"]
# Docker Engine backend over the docker API (C7). Container names are the
# opaque instance ids; snapshots are committed images.
docker = ["dep:bollard"]
# Firecracker microVM backend (C7, stub: declares accurate capabilities, every
# operation returns `ProviderNotImplemented`).
firecracker = []
# macOS container backend (C7, stub: declares accurate capabilities, every
# operation returns `ProviderNotImplemented`).
apple-container = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"], optional = true }
bollard = { version = "0.21", optional = true }
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }